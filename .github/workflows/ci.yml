name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alumnilink
          POSTGRES_PASSWORD: alumnilink
          POSTGRES_DB: alumnilink
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://alumnilink:alumnilink@localhost:5432/alumnilink
      MIGRATION_TEST_DATABASE_URL: postgres://alumnilink:alumnilink@localhost:5432/alumnilink
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      EMAIL_TOKEN_SECRET: ci-email-token-secret-at-least-32-characters
      ANALYTICS_HMAC_SECRET: ci-analytics-hmac-secret-at-least-32-characters
      CURSOR_HMAC_SECRET: ci-cursor-hmac-secret-at-least-32-characters
      CURRENT_TERMS_VERSION: 2026-11-01
      CURRENT_TERMS_EFFECTIVE_AT: 2026-11-01T00:00:00Z
      TERMS_URL: http://localhost:5173/terms
      PRIVACY_URL: http://localhost:5173/privacy
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm test
      - run: node --test test/migrations.test.js

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
