<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Top horizontal -->
  <line x1="6" y1="6" x2="18" y2="6" stroke="#0B1B2B" stroke-width="2.5" stroke-linecap="round" />
  <!-- Left vertical -->
  <line x1="6" y1="6" x2="6" y2="18" stroke="#0B1B2B" stroke-width="2.5" stroke-linecap="round" />
  <!-- Top-Left to Bottom-Right -->
  <line x1="6" y1="6" x2="18" y2="18" stroke="#0B1B2B" stroke-width="2.5" stroke-linecap="round" />
  <!-- Bottom-Left to Top-Right -->
  <line x1="6" y1="18" x2="18" y2="6" stroke="#0B1B2B" stroke-width="2.5" stroke-linecap="round" />
  <!-- 5 Nodes -->
  <circle cx="6" cy="6" r="2.8" fill="#0B1B2B" />
  <circle cx="18" cy="6" r="2.8" fill="#0B1B2B" />
  <circle cx="12" cy="12" r="2.8" fill="#0B1B2B" />
  <circle cx="6" cy="18" r="2.8" fill="#0B1B2B" />
  <circle cx="18" cy="18" r="2.8" fill="#0B1B2B" />
</svg>
